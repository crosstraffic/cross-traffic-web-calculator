[package]
name = "HCM-middleware"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Web application for HCM."
repository = "https://github.com/crosstraffic/cross-traffic-web-calculator"

[lib]
crate-type = ["cdylib", "rlib"]
vercel_runtime = { version = "1.1.0" }

[dependencies]
# Path resolves to the sibling checkout for local development; CI and clean clones resolve the version from crates.io, so bump this only after that version is published.
# 0.3.9 (the Chapter 20 pedestrian crossing, the Chapter 23 SPUI surface, and the Chapter 11 incident inputs) was published to crates.io on 2026-08-13, tracking transportations_library 0.3.4 (crates.io + PyPI same day), so clean clones resolve. The committed pkg/ is rebuilt from the published-equivalent sibling checkouts and is what ships.

crosstraffic_middleware = { version = "0.3.9", path = "../../cross-traffic-middleware" }