[package]
name = "HCM-middleware"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Web application for HCM."
repository = "https://github.com/crosstraffic/cross-traffic-web-calculator"

[lib]
crate-type = ["cdylib", "rlib"]
vercel_runtime = { version = "1.1.0" }

[dependencies]
# Path resolves to the sibling checkout for local development; CI and clean clones resolve the version from crates.io, so bump this only after that version is published.
# 0.3.8 (the Chapter 23 parclo surface) is NOT published yet, and neither is the transportations_library 0.3.3 it tracks, so a clean-clone `npm run wasm` will fail to resolve until both are, library first. The committed pkg/ is built from the sibling checkout and is what ships; see VALIDATION.md.

crosstraffic_middleware = { version = "0.3.8", path = "../../cross-traffic-middleware" }