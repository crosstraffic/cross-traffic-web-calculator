[package]
name = "HCM-middleware"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Web application for HCM."
repository = "https://github.com/crosstraffic/cross-traffic-web-calculator"

[lib]
crate-type = ["cdylib", "rlib"]
vercel_runtime = { version = "1.1.0" }

[dependencies]
# Path resolves to the sibling checkout for local development; CI and clean clones resolve the version from crates.io, so bump this only after that version is published.
# 0.3.12 (the Chapter 10 Step A-2 ramp-section segmentation binding) was published to crates.io on 2026-08-18, tracking transportations_library 0.3.5 (published 2026-08-14). A clean clone resolves from the registry.

crosstraffic_middleware = { version = "0.3.12", path = "../../cross-traffic-middleware" }