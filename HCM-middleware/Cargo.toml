[package]
name = "HCM-middleware"
version = "0.1.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Web application for HCM."
repository = "https://github.com/crosstraffic/cross-traffic-web-calculator"

[lib]
crate-type = ["cdylib", "rlib"]
vercel_runtime = { version = "1.1.0" }

[dependencies]
# Path resolves to the sibling checkout for local development; CI and clean clones resolve the version from crates.io, so bump this only after that version is published.
# 0.3.11 (the Chapter 28 ramp service-flow-rate solver) is NOT on crates.io yet. It tracks transportations_library 0.3.5, which IS published, so unlike the 0.3.10 line only one crate has to go out: publishing the middleware alone makes a clean clone resolve this version. Local builds resolve through the path entry, so the committed pkg/ below is real. The previous line, 0.3.10 tracking library 0.3.5, was published on 2026-08-14 and does resolve.

crosstraffic_middleware = { version = "0.3.11", path = "../../cross-traffic-middleware" }