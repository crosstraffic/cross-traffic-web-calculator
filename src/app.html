<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      // Set the theme before first paint: saved choice wins, then the system
      // preference. The nav toggle updates both attributes and localStorage.
      (function () {
        try {
          var t = localStorage.getItem('hcm-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) { /* default stays light */ }
      })();
    </script>
    <meta name="description" content="The simple web calculator of Highway Capacity Manual for the transportation engineers." />
    <meta name="keywords" content="HCM, Highway Capacity Manual, Calculator, calculator, hcm, highway capacity manual, transportation, Transportation, chapter 15, Chapter 15, Calculation, calculation" />
    <meta name="author" content="Rei Tamaru" />
    <link rel="icon" href="%sveltekit.assets%/hcm_calculator_logo_s.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body>
    <div class="container max-w-none mx-auto min-h-screen flex flex-col">%sveltekit.body%</div>
  </body>
</html>
